<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Seongbin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, warm, a friend's surprise
   IDEA: a toy diorama box — a little stage where a toy girl opens a gift
   PICTURE: room with bunting, gift box, toy girl in hanbok, cake, balloons, confetti
   COLOUR and TYPE: blush pink room, teal gift, yellow ribbon, raspberry text; Jua + Fredoka
   LAYOUT: message on top, diorama centred, controls under it; stacks naturally on phones */
:root{color-scheme:light dark;
  --page:light-dark(#ffd6e0,#170b2a);--wall1:light-dark(#fff3f7,#3d2466);--wall2:light-dark(#ffc8dd,#24123f);
  --floor:light-dark(#ffb38a,#5a3477);--edge:light-dark(#f08a5d,#7b4a9c);
  --ink:light-dark(#3b0f2e,#fff0f6);--accent:light-dark(#d6336c,#ffafcc);--btn:light-dark(#d6336c,#ff8fb8);--btnInk:light-dark(#fff,#2a0f22)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100svh;background:var(--page);color:var(--ink);font:16px/1.5 Fredoka,system-ui,sans-serif;overflow-x:clip;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px max(4vw,12px) 28px;gap:14px}
.msg{min-height:clamp(96px,17vw,160px);text-align:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
h1{margin:0;font:400 clamp(40px,8.5vw,78px)/1.05 Jua,Fredoka,sans-serif;color:var(--accent);text-wrap:balance}
.ch{display:inline-block;opacity:0;transform:scale(.3) translateY(24px)}
.sp{display:inline-block;width:.3em}
.sub{margin:6px 0 0;font-size:clamp(18px,3vw,24px);font-weight:600;opacity:0}
.hint{margin:0;font-size:clamp(18px,3vw,22px);font-weight:500;transition:opacity .4s}
.play .hint{opacity:0;height:0;overflow:hidden}
.stage{position:relative;width:min(100%,940px);aspect-ratio:800/560;border-radius:24px;overflow:hidden;
  background:linear-gradient(var(--wall1),var(--wall2));box-shadow:0 18px 50px -20px rgba(80,10,50,.45),inset 0 0 0 6px rgba(255,255,255,.35)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.c{position:absolute;width:10px;height:6px;border-radius:2px;will-change:transform}
.start{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;
  font:600 clamp(18px,3vw,24px) Fredoka,sans-serif;padding:16px 28px;min-height:56px;border:0;border-radius:999px;
  background:var(--btn);color:var(--btnInk);cursor:pointer;box-shadow:0 10px 24px -8px rgba(160,20,80,.6);animation:pulse 1.6s ease-in-out infinite}
.start svg{width:20px;height:20px}
.play .start{display:none}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:48px}
.ctrl button{font:600 16px Fredoka,sans-serif;min-height:46px;padding:0 22px;border-radius:999px;cursor:pointer;
  border:2px solid var(--accent);background:transparent;color:var(--ink)}
.ctrl button.main{background:var(--btn);color:var(--btnInk);border-color:var(--btn)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
/* scene parts */
.floor{fill:var(--floor)}.edge{fill:var(--edge)}
.walker{transform:translateX(-470px)}
.lid,.cake,.burst,.flame,.eye{transform-box:fill-box;transform-origin:center}
.cake{transform:translateY(92px)}
.burst{transform:scale(0);opacity:0}
.bl{transform:translateY(660px)}
.eye{animation:blink 3.6s infinite}
.flame{animation:flick .25s ease-in-out infinite alternate}
/* timeline */
.play .walker{animation:walk 2.6s cubic-bezier(.35,.6,.45,1) both}
.play .bob{animation:bob .325s ease-in-out 8 alternate,hop .62s ease-in-out 4.3s infinite}
.play .fl{animation:step .325s ease-in-out 8 alternate}
.play .fr{animation:step .325s ease-in-out 8 alternate-reverse}
.play .armR{animation:armR 4.7s ease both}
.play .armL{animation:armL 4.7s ease both}
.play .lid{animation:lid 5.3s ease-in both}
.play .cake{animation:rise .9s cubic-bezier(.3,1.6,.5,1) 4.05s both}
.play .burst{animation:burst 1.1s ease-out 4s both}
.play .bl{animation:up 2.4s cubic-bezier(.2,.8,.3,1) var(--d) both}
.play .sw{animation:sway 2.8s ease-in-out calc(var(--d) + 2.4s) infinite alternate}
.play .ch{animation:pop .55s cubic-bezier(.3,1.8,.5,1) calc(4.35s + var(--i) * .07s) both}
.play .sub{animation:fade .7s ease 5.5s both}
@keyframes walk{to{transform:none}}
@keyframes bob{to{transform:translateY(-8px)}}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-34px)}}
@keyframes step{to{transform:translateY(-7px)}}
@keyframes armR{0%,64%{transform:rotate(8deg)}72%,84%{transform:rotate(-82deg)}93%,100%{transform:rotate(-150deg)}}
@keyframes armL{0%,84%{transform:rotate(-8deg)}94%,100%{transform:rotate(150deg)}}
@keyframes lid{0%,62%{transform:none;opacity:1}66%{transform:rotate(-6deg)}70%{transform:rotate(6deg)}73%{transform:rotate(-6deg) translateY(-4px)}76%{transform:rotate(4deg)}77%{transform:none;opacity:1}100%{transform:translate(160px,-400px) rotate(50deg);opacity:0}}
@keyframes rise{to{transform:none}}
@keyframes burst{0%{transform:scale(0);opacity:1}100%{transform:scale(3);opacity:0}}
@keyframes up{to{transform:none}}
@keyframes sway{to{transform:translate(10px,-12px)}}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{0%,93%,100%{transform:none}96%{transform:scaleY(.1)}}
@keyframes flick{to{transform:scale(.85,1.12)}}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06)}}
@media (prefers-reduced-motion:reduce){
  .play *,.start{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
  .eye,.flame{animation:none!important}}
@media (max-width:600px){.stage{border-radius:16px}}
</style>
</head>
<body>
<div class="msg">
  <p class="hint">A little surprise for Seongbin</p>
  <h1 aria-label="생일 축하해, 성빈아!"><span class="ch" style="--i:0">생</span><span class="ch" style="--i:1">일</span><span class="sp"></span><span class="ch" style="--i:2">축</span><span class="ch" style="--i:3">하</span><span class="ch" style="--i:4">해</span><span class="ch" style="--i:5">,</span><span class="sp"></span><span class="ch" style="--i:6">성</span><span class="ch" style="--i:7">빈</span><span class="ch" style="--i:8">아</span><span class="ch" style="--i:9">!</span></h1>
  <p class="sub">Happy Birthday, Seongbin!</p>
</div>

<div class="stage">
  <svg viewBox="0 0 800 560" aria-hidden="true">
    <defs>
      <pattern id="check" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="#f2f2f2"/><rect width="5" height="5" fill="#1d1b2e"/><rect x="5" y="5" width="5" height="5" fill="#1d1b2e"/>
      </pattern>
      <radialGradient id="glow"><stop offset="0" stop-color="#fffbe0"/><stop offset=".5" stop-color="#ffe066" stop-opacity=".8"/><stop offset="1" stop-color="#ffe066" stop-opacity="0"/></radialGradient>
      <g id="balloon"><path d="M0,40 q8,30 -4,60 q-10,30 4,62" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="30" ry="38"/><path d="M-6,38 L6,38 L0,46Z"/>
        <ellipse cx="-11" cy="-14" rx="7" ry="11" fill="#fff" opacity=".45"/></g>
    </defs>
    <!-- bunting -->
    <path d="M-10,28 Q400,150 810,28" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>
    <g id="flags"></g>
    <!-- balloons -->
    <g transform="translate(105,175)"><g class="bl" style="--d:4.2s"><g class="sw"><use href="#balloon" fill="#ffd23f"/></g></g></g>
    <g transform="translate(195,120)"><g class="bl" style="--d:4.45s"><g class="sw"><use href="#balloon" fill="#2ec4b6"/></g></g></g>
    <g transform="translate(700,150)"><g class="bl" style="--d:4.3s"><g class="sw"><use href="#balloon" fill="#ff5d8f"/></g></g></g>
    <g transform="translate(615,105)"><g class="bl" style="--d:4.6s"><g class="sw"><use href="#balloon" fill="#9b8cff"/></g></g></g>
    <!-- floor -->
    <rect class="floor" x="0" y="430" width="800" height="130"/>
    <rect class="edge" x="0" y="426" width="800" height="8"/>
    <!-- burst + cake (behind box) -->
    <circle class="burst" cx="520" cy="318" r="60" fill="url(#glow)"/>
    <g class="cake">
      <ellipse cx="520" cy="330" rx="50" ry="6" fill="#fff"/>
      <rect x="480" y="288" width="80" height="42" rx="6" fill="#ffafcc"/>
      <rect x="480" y="308" width="80" height="6" fill="#ff8fab"/>
      <rect x="477" y="282" width="86" height="14" rx="7" fill="#fff"/>
      <circle cx="490" cy="296" r="5" fill="#fff"/><circle cx="512" cy="298" r="4" fill="#fff"/><circle cx="538" cy="297" r="5" fill="#fff"/>
      <rect x="516" y="258" width="8" height="26" rx="2" fill="#a0c4ff"/>
      <rect x="516" y="264" width="8" height="4" fill="#fff"/><rect x="516" y="274" width="8" height="4" fill="#fff"/>
      <g class="flame"><ellipse cx="520" cy="248" rx="6" ry="10" fill="#ffb703"/><ellipse cx="520" cy="251" rx="3" ry="5" fill="#fff3b0"/></g>
    </g>
    <!-- gift box -->
    <ellipse cx="520" cy="442" rx="84" ry="9" fill="#000" opacity=".12"/>
    <rect x="450" y="330" width="140" height="110" rx="4" fill="#2ec4b6"/>
    <rect x="560" y="330" width="30" height="110" fill="#000" opacity=".1"/>
    <rect x="512" y="330" width="16" height="110" fill="#ffd23f"/>
    <rect x="456" y="336" width="8" height="98" rx="4" fill="#fff" opacity=".25"/>
    <g class="lid">
      <rect x="440" y="305" width="160" height="30" rx="6" fill="#3ad6c7"/>
      <rect x="440" y="326" width="160" height="9" fill="#000" opacity=".08"/>
      <rect x="512" y="305" width="16" height="30" fill="#ffd23f"/>
      <ellipse cx="503" cy="296" rx="19" ry="11" transform="rotate(-20 503 296)" fill="#ffd23f"/>
      <ellipse cx="537" cy="296" rx="19" ry="11" transform="rotate(20 537 296)" fill="#ffd23f"/>
      <circle cx="520" cy="301" r="7" fill="#f4b400"/>
    </g>
    <!-- modern toy girl: oversized checked shirt, baggy jeans, short hair, glasses -->
    <g transform="translate(330,440) scale(1.15)">
      <g class="walker"><g class="bob">
        <ellipse cx="0" cy="2" rx="46" ry="7" fill="#000" opacity=".13"/>
        <!-- baggy wide-leg pants + chunky sneakers -->
        <g class="fl">
          <path d="M-30,-84 L-1,-84 L-2,-10 Q-22,-6 -42,-10Z" fill="#a9c4e4"/>
          <path d="M-14,-80 L-18,-12" stroke="#8aa9cf" stroke-width="2"/>
          <path d="M-40,-14 Q-22,-9 -3,-14" fill="none" stroke="#8aa9cf" stroke-width="3"/>
          <path d="M-38,-10 L-4,-10 Q2,-10 2,-4 L2,0 L-40,0 Q-42,-6 -38,-10Z" fill="#fff"/>
          <rect x="-41" y="-2" width="44" height="5" rx="2" fill="#d9d9e3"/>
        </g>
        <g class="fr">
          <path d="M1,-84 L30,-84 L42,-10 Q22,-6 2,-10Z" fill="#a9c4e4"/>
          <path d="M14,-80 L18,-12" stroke="#8aa9cf" stroke-width="2"/>
          <path d="M3,-14 Q22,-9 40,-14" fill="none" stroke="#8aa9cf" stroke-width="3"/>
          <path d="M4,-10 L38,-10 Q42,-6 40,0 L-2,0 L-2,-4 Q-2,-10 4,-10Z" fill="#fff"/>
          <rect x="-3" y="-2" width="44" height="5" rx="2" fill="#d9d9e3"/>
        </g>
        <!-- oversized checked shirt -->
        <path d="M-34,-148 Q0,-155 34,-148 Q44,-110 46,-74 Q0,-66 -46,-74 Q-44,-110 -34,-148Z" fill="url(#check)"/>
        <path d="M-46,-74 Q0,-66 46,-74 L46,-70 Q0,-62 -46,-70Z" fill="#1d1b2e"/>
        <path d="M-18,-150 L0,-136 L-7,-127 L-21,-143Z M18,-150 L0,-136 L7,-127 L21,-143Z" fill="#1d1b2e" stroke="#f2f2f2" stroke-width="1.5"/>
        <line x1="0" y1="-136" x2="0" y2="-68" stroke="#f2f2f2" stroke-width="1.5"/>
        <circle cx="0" cy="-122" r="2.2" fill="#f2f2f2"/><circle cx="0" cy="-106" r="2.2" fill="#f2f2f2"/><circle cx="0" cy="-90" r="2.2" fill="#f2f2f2"/>
        <rect x="-30" y="-122" width="15" height="13" rx="2" fill="#1d1b2e" opacity=".55"/>
        <g transform="translate(-35,-140)"><g class="armL">
          <path d="M-12,-4 Q0,-10 12,-4 L13,36 L-13,36Z" fill="url(#check)"/>
          <rect x="-13" y="30" width="26" height="9" rx="3" fill="#1d1b2e"/>
          <circle cx="0" cy="47" r="8" fill="#ffe0c2"/></g></g>
        <g transform="translate(35,-140)"><g class="armR">
          <path d="M-12,-4 Q0,-10 12,-4 L13,36 L-13,36Z" fill="url(#check)"/>
          <rect x="-13" y="30" width="26" height="9" rx="3" fill="#1d1b2e"/>
          <circle cx="0" cy="47" r="8" fill="#ffe0c2"/></g></g>
        <!-- short hair -->
        <path d="M-40,-185 Q-42,-226 0,-226 Q42,-226 40,-185 L40,-166 Q34,-160 29,-167 L-29,-167 Q-34,-160 -40,-166Z" fill="#1d1b2e"/>
        <circle cx="0" cy="-182" r="36" fill="#ffe0c2"/>
        <path d="M-37,-188 Q-34,-223 0,-223 Q34,-223 37,-188 Q26,-199 15,-195 Q5,-204 -6,-195 Q-19,-202 -37,-188Z" fill="#1d1b2e"/>
        <ellipse class="eye" cx="-13" cy="-178" rx="4" ry="5" fill="#1d1b2e"/>
        <ellipse class="eye" cx="13" cy="-178" rx="4" ry="5" fill="#1d1b2e"/>
        <circle cx="-23" cy="-165" r="6" fill="#ff8fab" opacity=".6"/><circle cx="23" cy="-165" r="6" fill="#ff8fab" opacity=".6"/>
        <path d="M-8,-164 Q0,-155 8,-164" fill="none" stroke="#c9184a" stroke-width="3" stroke-linecap="round"/>
        <g fill="#fff" fill-opacity=".18" stroke="#1d1b2e" stroke-width="3">
          <rect x="-26" y="-189" width="23" height="20" rx="8"/><rect x="3" y="-189" width="23" height="20" rx="8"/>
          <path d="M-3,-181 Q0,-184 3,-181 M-26,-182 L-35,-185 M26,-182 L35,-185" fill="none"/>
        </g>
      </g></g>
    </g>
  </svg>
  <div class="conf" id="conf"></div>
  <button class="start" id="start" type="button"><svg viewBox="0 0 20 20"><path d="M5 3l12 7-12 7z" fill="currentColor"/></svg>Open the surprise</button>
</div>

<div class="ctrl">
  <button class="main" id="replay" type="button" hidden>Play again</button>
  <button id="mute" type="button" hidden aria-pressed="false">Sound: on</button>
</div>

<script>
{
  const body = document.body, conf = document.getElementById('conf');
  const startBtn = document.getElementById('start'), replayBtn = document.getElementById('replay'), muteBtn = document.getElementById('mute');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = ['#ff5d8f', '#ffd23f', '#2ec4b6', '#9b8cff', '#4361ee', '#ff9f1c'];

  // bunting flags along the string
  let flags = '';
  for (let i = 0, x = 20; x < 800; x += 52, i++) {
    const t = x / 800, y = (1 - t) * (1 - t) * 28 + 2 * (1 - t) * t * 150 + t * t * 28;
    flags += `<polygon points="${x - 15},${y - 2} ${x + 15},${y - 2} ${x},${y + 30}" fill="${colors[i % colors.length]}"/>`;
  }
  document.getElementById('flags').innerHTML = flags;

  // Happy Birthday melody (public domain)
  const N = {G4:392, A4:440, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99};
  const tune = [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
    ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]];
  const beat = .42;
  let ctx = null, master = null, muted = false, timers = [], drizzle = null;

  function note(f, t, d) {
    for (const [type, mul, g] of [['triangle', 1, .17], ['sine', 2, .05]]) {
      const o = ctx.createOscillator(), v = ctx.createGain();
      o.type = type; o.frequency.value = f * mul;
      v.gain.setValueAtTime(0, t);
      v.gain.linearRampToValueAtTime(g, t + .02);
      v.gain.exponentialRampToValueAtTime(.0005, t + d * .95);
      o.connect(v); v.connect(master);
      o.start(t); o.stop(t + d);
    }
  }
  function music() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.resume) ctx.resume();
      master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
      let t = ctx.currentTime + (reduce ? .3 : 4.1);
      for (const [n, b] of tune) { note(N[n], t, b * beat); t += b * beat; }
    } catch (e) { /* no sound available */ }
  }

  function piece(x, y, path, dur) {
    const el = document.createElement('div');
    el.className = 'c';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    if (Math.random() < .3) { el.style.width = el.style.height = '8px'; el.style.borderRadius = '50%'; }
    conf.appendChild(el);
    const a = el.animate(path, {duration: dur, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards'});
    a.onfinish = () => el.remove();
  }
  function burst() {
    const W = conf.clientWidth, H = conf.clientHeight, ox = W * 520 / 800, oy = H * 320 / 560;
    for (let i = 0; i < 110; i++) {
      const ang = -Math.PI / 2 + (Math.random() - .5) * 2.4, sp = (.35 + Math.random() * .6) * H;
      const dx = Math.cos(ang) * sp, dy = Math.sin(ang) * sp, r = Math.random() * 720 - 360;
      piece(ox, oy, [
        {transform: 'translate(0,0) rotate(0deg)', opacity: 1},
        {transform: `translate(${dx * .7}px,${dy}px) rotate(${r / 2}deg)`, opacity: 1, offset: .4},
        {transform: `translate(${dx}px,${dy + H * .9}px) rotate(${r}deg)`, opacity: 0}
      ], 2400 + Math.random() * 1400);
    }
  }
  function sprinkle() {
    const W = conf.clientWidth, H = conf.clientHeight, s = (Math.random() - .5) * 120;
    piece(Math.random() * W, -12, [
      {transform: 'translate(0,0) rotate(0deg)'},
      {transform: `translate(${s}px,${H * .5}px) rotate(200deg)`, offset: .5},
      {transform: `translate(${-s / 2}px,${H + 24}px) rotate(420deg)`}
    ], 3600 + Math.random() * 2000);
  }

  function reset() {
    body.classList.remove('play');
    timers.forEach(clearTimeout); timers = [];
    clearInterval(drizzle);
    conf.innerHTML = '';
    if (master) { try { master.disconnect(); } catch (e) {} master = null; }
  }
  function play() {
    reset();
    void body.offsetWidth;
    body.classList.add('play');
    music();
    muteBtn.hidden = false;
    replayBtn.hidden = true;
    if (!reduce) {
      timers.push(setTimeout(burst, 4000));
      timers.push(setTimeout(() => { drizzle = setInterval(sprinkle, 200); }, 4700));
    }
    timers.push(setTimeout(() => { replayBtn.hidden = false; }, reduce ? 300 : 6500));
  }

  startBtn.addEventListener('click', play);
  replayBtn.addEventListener('click', play);
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 1;
    muteBtn.textContent = muted ? 'Sound: off' : 'Sound: on';
    muteBtn.setAttribute('aria-pressed', String(muted));
  });
}
</script>
</body>
</html>
